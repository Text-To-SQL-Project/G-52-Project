services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: college_erp
    ports:
      - "5433:5432"   # host 5433 -> container 5432: avoids clashing with a native Postgres already on 5432
    volumes:
      - ./seed:/docker-entrypoint-initdb.d   # schema + all 25 tables' data + readonly role, run in order on first boot
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d college_erp"]
      interval: 5s
      timeout: 3s
      retries: 20   # the attendance/marks inserts (190k rows total) take longer than the old sample_shop seed

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env   # LLM_API_KEY and any local overrides; see .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/college_erp
      READONLY_DATABASE_URL: postgresql+psycopg://readonly_app:readonly_app@db:5432/college_erp
      DB_SCHEMA: college_erp
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      LITELLM_URL: http://litellm:4000
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app        # live reload during dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    environment:
      API_ORIGIN: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

  # Admin-managed AI key pool (app/llm_pool.py). Its own database: provider
  # keys never share a server with the ERP data generated SQL can reach.
  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm}@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # Encrypts provider keys at rest. Never change it after keys are added.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"   # loopback only: the master key is the only auth in front of it

volumes:
  pgdata:
  litellm-pgdata:
